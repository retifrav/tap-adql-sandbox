[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# otherwise ruff's own default rule set
ignore = [
    # the GUI catches any exception from PyVO/astroquery/Dear PyGui
    # to show it in the window instead of crashing
    "BLE001"
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# dependencies might not be installed where ty runs,
# the same role as the former ignore_missing_imports of mypy
allowed-unresolved-imports = [
    "astroquery.**",
    "dearpygui.**",
    "pandas.**",
    "pyvo.**",
    "setuptools.**",
    "tabulate.**"
]
